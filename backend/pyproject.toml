[project]
name = "opspilot-backend"
version = "0.1.0"
description = "FastAPI service for the OpsPilot AI run console"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.12,<1",
    "uvicorn>=0.34.3,<1",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg>=0.30.0,<1",
    "pydantic>=2.11.5,<3",
    "pydantic-settings>=2.9.1,<3",
    "alembic>=1.16,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "httpx>=0.28.1",
    "ruff>=0.11.12",
    "mypy>=1.16.0",
    "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
