name: opspilot-phase8

services:
  db:
    environment:
      POSTGRES_PASSWORD: opspilot_test
    ports: !override
      - "127.0.0.1:15432:5432"

  backend:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot_test@db:5432/opspilot
      TEST_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot_test@db:5432/postgres
      LLM_PROVIDER: fake
      BUSINESS_TIMEZONE: UTC
      MODEL_PRICES: "{}"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:13000,http://localhost:13000
    ports: !override
      - "127.0.0.1:18000:8000"
    command: ["sh", "-ec", "alembic upgrade head && python -m app.seed --reference-date 2026-02-15 && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]

  frontend:
    environment:
      API_INTERNAL_URL: http://backend:8000
      BROWSER_API_BASE_URL: http://127.0.0.1:18000
    ports: !override
      - "127.0.0.1:13000:3000"
